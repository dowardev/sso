# ============================================================
# sso — GitHub Actions
# Traducido desde .gitlab-ci.yml (ver odd/tasks/github-migration-translation.md)
#
# DESVIACIÓN DOCUMENTADA (guía, sección 0.1): en GitLab los jobs de deploy
# consumen los artifacts de los jobs `build` del mismo pipeline. En GitHub los
# artifacts no cruzan entre workflows, así que TODOS los jobs viven en un único
# workflow y los artifacts viajan con actions/download-artifact.
#
# Un solo workflow además preserva la semántica de `rules` de GitLab:
#   - lint/test/build  → tag de release O merge request  (.pipeline_rules)
#   - deploy/rollback  → solo tag                         (.tag_rules)
#
# Mapeo de jobs (nombres idénticos a propósito: son los required checks):
#   backend_lint, frontend_lint, client_lint, server_lint
#   backend_test, frontend_test_unit, server_test
#   backend_assets_build, backend_build, frontend_build, client_build, server_build
#   backend_deploy, frontend_deploy, rollback_backend, rollback_frontend
#
# NOTA: la publicación de @dowardev/sso-client (npm) y de dowardev/sso-server
# (Packagist, vía git subtree split) NO son jobs de este pipeline en GitLab:
# son pasos manuales documentados en DEPLOY.md. No se inventan aquí.
# ============================================================

name: CI

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      rollback_target:
        description: 'Rollback target: backend, frontend or both'
        required: false
        default: 'both'
        type: choice
        options:
          - backend
          - frontend
          - both
      tag:
        description: 'Tag to roll back to (empty = previous tag computed automatically)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_HOME: ${{ github.workspace }}/back/.composer
  # GitLab: la version de node sale de mise.toml (node = "lts").
  # GitHub: setup-node acepta el alias 'lts' con la misma semantica.
  NODE_VERSION: '24'
  PNPM_VERSION: '11.3.0'

jobs:
  # ============================================================
  # STAGE: lint
  # Corre en tags de release y en merge requests (.pipeline_rules).
  # ============================================================

  # Gate de tag semver: las expresiones de GitHub Actions no tienen regex
  # (no existe `matches()`), asi que el filtro exacto de las tag rules de
  # GitLab (^vX.Y.Z con prerelease opcional) se evalua aqui en bash.
  # Salida `release`: 'true' solo para tags semver validas.
  release_gate:
    name: release_gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dryrun)\.[0-9]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  backend_lint:
    name: backend_lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            back/vendor
            back/.composer/cache
          key: composer-${{ hashFiles('back/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        working-directory: back
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run pint
        working-directory: back
        run: vendor/bin/pint --test

  frontend_lint:
    name: frontend_lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: front
        run: pnpm run lint

  client_lint:
    name: client_lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @dowardev/sso-client...

      - name: Typecheck client package
        run: pnpm --filter @dowardev/sso-client run typecheck

  server_lint:
    name: server_lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/sso-server/vendor
            packages/sso-server/.composer/cache
          key: composer-${{ hashFiles('packages/sso-server/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        working-directory: packages/sso-server
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run pint
        working-directory: packages/sso-server
        run: vendor/bin/pint --test

  # ============================================================
  # STAGE: test
  # En GitLab estos jobs no declaran `needs`, por lo que esperan a que
  # termine el stage `lint` completo. Se replica con needs sobre los 4 lints.
  # ============================================================

  backend_test:
    name: backend_test
    runs-on: ubuntu-latest
    needs: [backend_lint, frontend_lint, client_lint, server_lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            back/vendor
            back/.composer/cache
          key: composer-${{ hashFiles('back/composer.lock') }}
          restore-keys: composer-

      - name: Prepare testing environment
        working-directory: back
        run: |
          cp .env.testing.example .env
          echo "APP_KEY=" >> .env
          composer install --prefer-dist --no-progress --no-interaction
          php artisan key:generate --force
          mkdir -p keys
          php artisan jwt:generate-keys || echo "jwt:generate-keys did not complete (keys may already exist)"
          php artisan config:clear

      - name: Run Laravel tests
        working-directory: back
        run: php artisan test

  frontend_test_unit:
    name: frontend_test_unit
    runs-on: ubuntu-latest
    needs: [backend_lint, frontend_lint, client_lint, server_lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: front
        run: pnpm exec vitest run

  server_test:
    name: server_test
    runs-on: ubuntu-latest
    needs: [backend_lint, frontend_lint, client_lint, server_lint]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/sso-server/vendor
            packages/sso-server/.composer/cache
          key: composer-${{ hashFiles('packages/sso-server/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        working-directory: packages/sso-server
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run phpunit
        working-directory: packages/sso-server
        run: php vendor/bin/phpunit

  # ============================================================
  # STAGE: build
  # ============================================================

  backend_assets_build:
    name: backend_assets_build
    runs-on: ubuntu-latest
    needs: [backend_test, frontend_test_unit, server_test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        working-directory: back
        run: pnpm install --frozen-lockfile

      - name: Build assets
        working-directory: back
        run: pnpm run build

      - name: Upload backend assets
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: back/public/build/
          retention-days: 1

  backend_build:
    name: backend_build
    runs-on: ubuntu-latest
    needs: [backend_assets_build]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        working-directory: back
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Cache application
        working-directory: back
        run: |
          php artisan config:cache
          php artisan route:cache

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: back/
          retention-days: 1

  frontend_build:
    name: frontend_build
    runs-on: ubuntu-latest
    needs: [backend_test, frontend_test_unit, server_test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      # GitLab: FRONTEND_ENV_FILE es una variable protegida que solo existe en
      # pipelines de tags y apunta a un ARCHIVO. En GitHub el secret guarda el
      # CONTENIDO del env file, asi que se escribe el contenido directamente.
      # En merge requests se compila con el .env de ejemplo.
      - name: Prepare production env
        working-directory: front
        env:
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
        run: |
          if [ -n "$FRONTEND_ENV_FILE" ]; then
            printf '%s\n' "$FRONTEND_ENV_FILE" > .env.production
          else
            cp .env.production.example .env.production
          fi

      - name: Build frontend
        working-directory: front
        run: pnpm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: front/dist/
          retention-days: 1

  client_build:
    name: client_build
    runs-on: ubuntu-latest
    needs: [backend_test, frontend_test_unit, server_test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @dowardev/sso-client...

      - name: Build client package
        run: pnpm --filter @dowardev/sso-client run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: packages/sso-client/dist/
          retention-days: 1

  server_build:
    name: server_build
    runs-on: ubuntu-latest
    needs: [backend_test, frontend_test_unit, server_test]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        working-directory: packages/sso-server
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: packages/sso-server/
          retention-days: 1

  # ============================================================
  # STAGE: deploy (solo tags)
  # ============================================================

  backend_deploy:
    name: backend_deploy
    runs-on: ubuntu-latest
    needs: [release_gate, backend_lint, backend_test, backend_build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release_gate.outputs.release == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # En GitLab los artifacts del job `backend_build` se descargaban al
      # workspace del job de deploy. En GitHub hay que bajarlos explicitamente.
      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: back

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Deploy backend
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_BACKEND: ${{ vars.DEPLOY_PATH_BACKEND }}
        run: |
          tar -czf /tmp/backend.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/app/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='bootstrap/cache/*.php' \
            -C back .
          scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_BACKEND &&
            tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
            cd $DEPLOY_PATH_BACKEND &&
            composer install --no-dev --optimize-autoloader --no-interaction &&
            php artisan migrate --force &&
            php artisan config:cache &&
            php artisan route:cache &&
            rm /tmp/backend.tar.gz
          "

  frontend_deploy:
    name: frontend_deploy
    runs-on: ubuntu-latest
    needs: [release_gate, frontend_lint, frontend_test_unit, frontend_build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release_gate.outputs.release == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: front/dist

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_FRONTEND: ${{ vars.DEPLOY_PATH_FRONTEND }}
        run: |
          tar -czf /tmp/frontend.tar.gz -C front/dist .
          scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_FRONTEND &&
            tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
            rm /tmp/frontend.tar.gz
          "

  # ============================================================
  # STAGE: rollback (manual en GitLab -> workflow_dispatch)
  # ============================================================

  rollback_backend:
    name: rollback_backend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_target == 'backend' || inputs.rollback_target == 'both')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Roll back backend
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_BACKEND: ${{ vars.DEPLOY_PATH_BACKEND }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            PREVIOUS_TAG="$REQUESTED_TAG"
          else
            PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
          fi
          if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
          echo "Rolling back to $PREVIOUS_TAG"
          git checkout "$PREVIOUS_TAG" -- back/
          tar -czf /tmp/backend-rollback.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/app/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='bootstrap/cache/*.php' \
            -C back .
          scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_BACKEND &&
            tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
            cd $DEPLOY_PATH_BACKEND &&
            composer install --no-dev --optimize-autoloader --no-interaction &&
            php artisan migrate --force &&
            php artisan config:cache &&
            php artisan route:cache &&
            rm /tmp/backend-rollback.tar.gz
          "

  rollback_frontend:
    name: rollback_frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_target == 'frontend' || inputs.rollback_target == 'both')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # GitLab hacia el setup a mano: id_rsa + known_hosts + ~/.ssh/config con
      # los algoritmos RSA legacy. Se replica igual: la accion
      # webfactory/ssh-agent no tiene input para known_hosts.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlgorithms +ssh-rsa\n  PubkeyAcceptedAlgorithms +ssh-rsa\n' > ~/.ssh/config

      - name: Roll back frontend
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH_FRONTEND: ${{ vars.DEPLOY_PATH_FRONTEND }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            PREVIOUS_TAG="$REQUESTED_TAG"
          else
            PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
          fi
          if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
          echo "Rolling back to $PREVIOUS_TAG"
          git checkout "$PREVIOUS_TAG" -- front/
          cd front
          pnpm install --frozen-lockfile
          printf '%s\n' "$FRONTEND_ENV_FILE" > .env.production
          pnpm run build
          cd ..
          tar -czf /tmp/frontend-rollback.tar.gz -C front/dist .
          scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            mkdir -p $DEPLOY_PATH_FRONTEND &&
            tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
            rm /tmp/frontend-rollback.tar.gz
          "

  # ============================================================
  # STAGE: publish
  # Publica los paquetes del monorepo. En GitLab NO habia jobs de
  # publish: la publicacion era manual, desde una maquina local. Esto
  # la automatiza con el mismo criterio que el deploy (solo tags de
  # release validas).
  #
  # - Reutiliza el build ya testeado (artifact), no recompila.
  # - No publica si esa version ya esta en el registro.
  # - Sin el secret NPM_TOKEN el job FALLA (no omite en silencio): si hay
  #   algo que publicar y no hay credencial, el release tiene que quedar en
  #   rojo. Si no hay nada que publicar, el job se omite igual.
  # ============================================================
  publish_npm:
    name: publish:npm
    runs-on: ubuntu-latest
    needs: [release_gate, client_build]
    if: startsWith(github.ref, 'refs/tags/') && needs.release_gate.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tested client build
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: packages/sso-client/dist

      - name: Check the version against the npm registry
        id: version
        env:
          PACKAGE_DIR: packages/sso-client
        run: |
          set -euo pipefail
          name=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          version=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          echo "package=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$( { npm view "$name" versions --json 2>/dev/null || true; } | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(raw);
                console.log(Array.isArray(parsed) ? parsed.join(" ") : String(parsed));
              } catch (error) {
                console.log("");
              }
            });
          ' )
          if [[ " $published " == *" $version "* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La version $version de $name ya esta publicada: se omite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/sso-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.version.outputs.package }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::notice::No hay secret NPM_TOKEN: se intenta con trusted publishing (OIDC). Si no esta configurado en npmjs.com, la publicacion falla."
          fi
          if ! npm publish --provenance --access public; then
            echo "::error::No se pudo publicar $PACKAGE_NAME@$PACKAGE_VERSION: falta la credencial (secret NPM_TOKEN o trusted publishing de npm en npmjs.com)"
            echo "Publicacion fallida: falta la credencial para $PACKAGE_NAME@$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Publica el paquete de composer (dowardev/sso-server) a Packagist.
  #
  # Packagist no se publica con un token: lee el codigo del repositorio.
  # Para un monorepo se usa un "subtree split": la subcarpeta del paquete
  # se sube a la rama `subtree-split` con un tag `<version>-subtree-split`
  # y Packagist la detecta sola. Como el paquete vive en este mismo repo,
  # el push usa el GITHUB_TOKEN del workflow (sin credenciales extra).
  publish_composer:
    name: publish:composer
    runs-on: ubuntu-latest
    needs: [release_gate]
    if: startsWith(github.ref, 'refs/tags/') && needs.release_gate.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version against Packagist
        id: version
        env:
          PACKAGE_DIR: packages/sso-server
          PACKAGE_NAME: dowardev/sso-server
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' "$PACKAGE_DIR/composer.json" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$( { curl -sS "https://repo.packagist.org/p2/$PACKAGE_NAME.json" 2>/dev/null || true; } | grep -o '"version":"[^"]*"' | cut -d '"' -f 4 | tr '\n' ' ' )
          if [[ " $published " == *" $version "* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La version $version de $PACKAGE_NAME ya esta publicada: se omite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the subtree split to Packagist
        if: steps.version.outputs.publish == 'true'
        env:
          PACKAGE_DIR: packages/sso-server
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix="$PACKAGE_DIR" -b subtree-split
          git push origin subtree-split
          # Se crean los dos tags (con y sin "v") porque Packagist normaliza
          # el prefijo de forma segun la version del tag.
          git tag "$PACKAGE_VERSION-subtree-split" subtree-split
          git tag "v$PACKAGE_VERSION-subtree-split" subtree-split
          git push origin "$PACKAGE_VERSION-subtree-split" "v$PACKAGE_VERSION-subtree-split"
