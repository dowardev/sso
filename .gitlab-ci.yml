image: alpine:latest

# Pipeline: deploy automatizado de back + front SOLO en tags semver (con prerelease opcional).
# Publicación de @dowardev/sso-client (npm) es MANUAL — job manual en stage deploy.
# Publicación de dowardev/sso-server (Packagist) es MANUAL — vía git subtree split (ver DEPLOY.md).

stages:
  - lint
  - test
  - build
  - deploy
  - post-deploy
  - rollback

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - back/vendor/
    - back/.composer/cache/
    - packages/sso-server/vendor/
    - packages/sso-server/.composer/cache/
    - front/.pnpm-store/
    - packages/sso-client/.pnpm-store/
    - packages/sso-server/.pnpm-store/

# Tags semver con prerelease opcional: vX.Y.Z, vX.Y.Z-alpha.N, vX.Y.Z-beta.N, vX.Y.Z-rc.N
.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

# Setup SSH comun: usa SSH_KNOWN_HOSTS (CI var masked) en vez de ssh-keyscan
.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

# Setup pnpm comun: corepack + pnpm@11 + frozen-lockfile
.pnpm_setup:
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile

# Setup composer comun: composer:2.8 + COMPOSER_HOME fijado
.composer_setup:
  before_script:
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# Backend Laravel jobs
.backend_setup:
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# Frontend Ionic Vue jobs
.frontend_setup:
  before_script:
    - cd front
    - corepack enable
    - pnpm install --frozen-lockfile

# sso-client package jobs
.client_setup:
  before_script:
    - cd packages/sso-client
    - corepack enable
    - pnpm install --frozen-lockfile

# sso-server package jobs
.server_setup:
  before_script:
    - cd packages/sso-server
    - export COMPOSER_HOME="$CI_PROJECT_DIR/packages/sso-server/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# ============================================
# STAGE: lint
# ============================================

backend_lint:
  stage: lint
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .backend_setup]
  script:
    - vendor/bin/pint --test

frontend_lint:
  stage: lint
  image: node:24.4-alpine
  extends: [.tag_rules, .frontend_setup]
  script:
    - pnpm run lint

client_lint:
  stage: lint
  image: node:24.4-alpine
  extends: [.tag_rules, .client_setup]
  script:
    - pnpm run typecheck

server_lint:
  stage: lint
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .server_setup]
  script:
    - vendor/bin/pint --test

# ============================================
# STAGE: test
# ============================================

backend_test:
  stage: test
  image: php:8.3-cli
  extends: [.tag_rules, .backend_setup]
  variables:
    APP_KEY: $APP_KEY
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - cp .env.testing.example .env
    - composer install --prefer-dist --no-progress --no-interaction
  script:
    - php artisan test --parallel

frontend_test_unit:
  stage: test
  image: node:24.4-alpine
  extends: [.tag_rules, .frontend_setup]
  script:
    - pnpm run test:unit

client_test:
  stage: test
  image: node:24.4-alpine
  extends: [.tag_rules, .client_setup]
  script:
    - pnpm run test

server_test:
  stage: test
  image: php:8.3-cli
  extends: [.tag_rules, .server_setup]
  script:
    - php vendor/bin/phpunit

# ============================================
# STAGE: build
# ============================================

backend_build:
  stage: build
  image: php:8.3-cli
  extends: [.tag_rules, .backend_setup]
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction
    - php artisan config:cache
    - php artisan route:cache
  artifacts:
    paths:
      - back/
    expire_in: 1h

frontend_build:
  stage: build
  image: node:24.4-alpine
  extends: [.tag_rules, .frontend_setup]
  script:
    - pnpm run build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1h

client_build:
  stage: build
  image: node:24.4-alpine
  extends: [.tag_rules, .client_setup]
  script:
    - pnpm run build
  artifacts:
    paths:
      - packages/sso-client/dist/
    expire_in: 1h

server_build:
  stage: build
  image: php:8.3-cli
  extends: [.tag_rules, .server_setup]
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction
  artifacts:
    paths:
      - packages/sso-server/
    expire_in: 1h

# ============================================
# STAGE: deploy
# ============================================

backend_deploy:
  stage: deploy
  image: alpine
  extends: [.ssh_setup, .tag_rules]
  needs:
    - backend_lint
    - backend_test
    - backend_build
  before_script:
    - !reference [.ssh_setup, before_script]
  script:
    - |
      tar -czf /tmp/backend.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        -C back .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine
  extends: [.ssh_setup, .tag_rules]
  needs:
    - frontend_lint
    - frontend_test_unit
    - frontend_build
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache nodejs npm
  script:
    - |
      tar -czf /tmp/frontend.tar.gz -C front/dist .
    - scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend.tar.gz
      "

# Publicación manual de @dowardev/sso-client a npm (solo cuando se quiera)
client_publish_npm:
  stage: deploy
  image: node:24.4-alpine
  extends: [.tag_rules, .client_setup]
  needs:
    - client_lint
    - client_test
    - client_build
  when: manual
  script:
    - npm publish --access public

# ============================================
# STAGE: post-deploy (healthchecks)
# ============================================

post_deploy_backend:
  stage: post-deploy
  image: alpine
  extends: [.tag_rules]
  needs:
    - backend_deploy
  script:
    - apk add --no-cache wget
    - wget -q -S --spider "$HEALTHCHECK_URL_BACKEND"

post_deploy_frontend:
  stage: post-deploy
  image: alpine
  extends: [.tag_rules]
  needs:
    - frontend_deploy
  script:
    - apk add --no-cache wget
    - wget -q -S --spider "$HEALTHCHECK_URL_FRONTEND"

# ============================================
# STAGE: rollback (manual)
# ============================================

rollback_backend:
  stage: rollback
  image: alpine
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- back/
      cd back
      export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
      composer install --no-dev --optimize-autoloader --no-interaction
      php artisan config:cache
      php artisan route:cache
      cd ..
      tar -czf /tmp/backend-rollback.tar.gz -C back .
      scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend-rollback.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: alpine
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- front/
      cd front
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build
      cd ..
      tar -czf /tmp/frontend-rollback.tar.gz -C front/dist .
      scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend-rollback.tar.gz
      "
