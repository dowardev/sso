image: alpine:3.20

# Pipeline: deploy automatizado de back + front SOLO en tags semver (con prerelease opcional).
# Publicación de @dowardev/sso-client (npm) es MANUAL — job manual en stage deploy.
# Publicación de dowardev/sso-server (Packagist) es MANUAL — vía git subtree split (ver DEPLOY.md).

stages:
  - lint
  - test
  - build
  - deploy
  - rollback

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - back/vendor/
    - back/.composer/cache/
    - packages/sso-server/vendor/
    - packages/sso-server/.composer/cache/

# Tags semver con prerelease opcional: vX.Y.Z, vX.Y.Z-alpha.N, vX.Y.Z-beta.N, vX.Y.Z-rc.N
.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'

# Jobs de validacion (lint, test, build): corren en tags de release y en merge requests.
# Deploy y rollback siguen siendo solo-tag (usan .tag_rules).
.pipeline_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Setup SSH comun: usa SSH_KNOWN_HOSTS (CI var masked) en vez de ssh-keyscan
.ssh_setup:
  before_script:
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache openssh-client; else apt-get update && apt-get install -y --no-install-recommends openssh-client; fi
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - echo "Host *" > ~/.ssh/config
    - echo "  HostKeyAlgorithms +ssh-rsa" >> ~/.ssh/config
    - echo "  PubkeyAcceptedAlgorithms +ssh-rsa" >> ~/.ssh/config

# Toolchain node via mise: la version sale de mise.toml (node = "lts"), no de una tag de Docker.
# pnpm sale de package.json (packageManager). Requiere imagen glibc (debian), no alpine.
.mise_setup:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates bash libatomic1 libstdc++6
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    - mise trust --all
    - mise install node
    - export PATH="$(mise where node)/bin:$PATH"
    - npm install -g "$(node -p "require(process.env.CI_PROJECT_DIR + '/package.json').packageManager")"

# Setup composer comun: composer:2.8 + COMPOSER_HOME fijado
.composer_setup:
  before_script:
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# Backend Laravel jobs
.backend_setup:
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# Frontend Ionic Vue jobs
.frontend_setup:
  before_script:
    - !reference [.mise_setup, before_script]
    - cd front
    - pnpm install --frozen-lockfile

# sso-client package jobs
.client_setup:
  before_script:
    - !reference [.mise_setup, before_script]
    - pnpm install --frozen-lockfile --filter @dowardev/sso-client...

# sso-server package jobs
.server_setup:
  before_script:
    - cd packages/sso-server
    - export COMPOSER_HOME="$CI_PROJECT_DIR/packages/sso-server/.composer"
    - composer install --prefer-dist --no-progress --no-interaction

# ============================================
# STAGE: lint
# ============================================

backend_lint:
  stage: lint
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.pipeline_rules, .backend_setup]
  script:
    - vendor/bin/pint --test

frontend_lint:
  stage: lint
  image: debian:bookworm-slim
  extends: [.pipeline_rules, .frontend_setup]
  script:
    - pnpm run lint

client_lint:
  stage: lint
  image: debian:bookworm-slim
  extends: [.pipeline_rules, .client_setup]
  script:
    - pnpm --filter @dowardev/sso-client run typecheck

server_lint:
  stage: lint
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.pipeline_rules, .server_setup]
  script:
    - vendor/bin/pint --test

# ============================================
# STAGE: test
# ============================================

backend_test:
  stage: test
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.pipeline_rules, .backend_setup]
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - cp .env.testing.example .env
    - echo "APP_KEY=" >> .env
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan key:generate --force
    - mkdir -p keys
    - php artisan jwt:generate-keys || true
    - php artisan config:clear
  script:
    - php artisan test

frontend_test_unit:
  stage: test
  image: debian:bookworm-slim
  extends: [.pipeline_rules, .frontend_setup]
  script:
    - pnpm exec vitest run

# client_test: sso-client no tiene tests (no tests/ dir). Solo typecheck en lint.

server_test:
  stage: test
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.pipeline_rules, .server_setup]
  script:
    - php vendor/bin/phpunit

# ============================================
# STAGE: build
# ============================================

backend_build:
  stage: build
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.pipeline_rules, .backend_setup]
  needs:
    - backend_assets_build
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction
    - php artisan config:cache
    - php artisan route:cache
  artifacts:
    paths:
      - back/
    expire_in: 1h

backend_assets_build:
  stage: build
  image: debian:bookworm-slim
  extends: [.pipeline_rules, .mise_setup]
  script:
    - cd back
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - back/public/build/
    expire_in: 1h

frontend_build:
  stage: build
  image: debian:bookworm-slim
  extends: [.pipeline_rules, .frontend_setup]
  script:
    # FRONTEND_ENV_FILE es una variable protegida: solo existe en pipelines de tags.
    # En merge requests se compila con el .env de ejemplo (el artefacto no se despliega).
    - if [ -n "$FRONTEND_ENV_FILE" ]; then cp "$FRONTEND_ENV_FILE" .env.production; else cp .env.production.example .env.production; fi
    - pnpm run build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1h

client_build:
  stage: build
  image: debian:bookworm-slim
  extends: [.pipeline_rules, .client_setup]
  script:
    - pnpm --filter @dowardev/sso-client run build
  artifacts:
    paths:
      - packages/sso-client/dist/
    expire_in: 1h

server_build:
  stage: build
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.pipeline_rules, .server_setup]
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction
  artifacts:
    paths:
      - packages/sso-server/
    expire_in: 1h

# ============================================
# STAGE: deploy
# ============================================

backend_deploy:
  stage: deploy
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  needs:
    - backend_lint
    - backend_test
    - backend_build
  before_script:
    - !reference [.ssh_setup, before_script]
  script:
    - |
      tar -czf /tmp/backend.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        -C back .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  needs:
    - frontend_lint
    - frontend_test_unit
    - frontend_build
  before_script:
    - !reference [.ssh_setup, before_script]
  script:
    - |
      tar -czf /tmp/frontend.tar.gz -C front/dist .
    - scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend.tar.gz
      "

rollback_backend:
  stage: rollback
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- back/
      tar -czf /tmp/backend-rollback.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        -C back .
      scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend-rollback.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: debian:bookworm-slim
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.mise_setup, before_script]
    - !reference [.ssh_setup, before_script]
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache git; else apt-get update && apt-get install -y --no-install-recommends git; fi
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- front/
      cd front
      pnpm install --frozen-lockfile
      cp "$FRONTEND_ENV_FILE" .env.production
      pnpm run build
      cd ..
      tar -czf /tmp/frontend-rollback.tar.gz -C front/dist .
      scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend-rollback.tar.gz
      "
